<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibra</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f6f6f7;
  --card:#ffffff;
  --text:#111111;
  --muted:#777777;
  --border:#e5e5e7;
  --accent:#111111;
  --danger:#e53935;
  --shadow:0 8px 30px rgba(0,0,0,.06);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

body.dark{
  --bg:#0d0d0f;
  --card:#171719;
  --text:#ffffff;
  --muted:#99999f;
  --border:#29292d;
  --accent:#ffffff;
  --shadow:0 8px 30px rgba(0,0,0,.25);
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

.auth-screen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:420px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px;
  box-shadow:var(--shadow);
}

.logo{
  font-size:38px;
  font-weight:800;
  letter-spacing:-2px;
  text-align:center;
  margin-bottom:8px;
}

.auth-subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:28px;
}

.input{
  width:100%;
  padding:14px 15px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--bg);
  color:var(--text);
  outline:none;
  margin-bottom:12px;
}

.input:focus{
  border-color:var(--text);
}

.primary-btn{
  width:100%;
  border:0;
  background:var(--accent);
  color:var(--bg);
  padding:14px;
  border-radius:13px;
  font-weight:700;
}

.auth-switch{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
}

.auth-switch button{
  border:0;
  background:none;
  color:var(--text);
  font-weight:700;
}

/* APP */

.app{
  min-height:100vh;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:64px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.top-logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:-1.5px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:18px;
}

.layout{
  max-width:1250px;
  margin:auto;
  padding:84px 20px 30px;
  display:grid;
  grid-template-columns:220px minmax(0,650px) 260px;
  gap:24px;
}

.sidebar{
  position:sticky;
  top:84px;
  height:max-content;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--text);
  padding:13px 15px;
  border-radius:13px;
  text-align:left;
  font-weight:600;
}

.nav-btn:hover,
.nav-btn.active{
  background:var(--card);
  box-shadow:var(--shadow);
}

.main{
  min-width:0;
}

.rightbar{
  position:sticky;
  top:84px;
  height:max-content;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.section{
  margin-bottom:18px;
}

/* COMPOSER */

.composer{
  padding:16px;
}

.composer-row{
  display:flex;
  gap:12px;
  align-items:center;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:var(--border);
  flex:none;
}

.avatar.small{
  width:36px;
  height:36px;
}

.composer-input{
  flex:1;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  padding:12px 15px;
  border-radius:25px;
  outline:none;
  cursor:pointer;
}

.composer-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
}

.secondary-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:9px 14px;
  border-radius:10px;
  font-weight:600;
}

/* POST */

.post{
  overflow:hidden;
  margin-bottom:18px;
}

.post-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
}

.post-user{
  display:flex;
  gap:10px;
  align-items:center;
}

.post-user-info{
  display:flex;
  flex-direction:column;
}

.username{
  font-weight:700;
}

.post-time{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.post-menu{
  border:0;
  background:none;
  color:var(--muted);
  font-size:20px;
}

.post-media{
  width:100%;
  max-height:700px;
  object-fit:contain;
  display:block;
  background:#000;
}

.post-content{
  padding:14px 16px 16px;
}

.post-caption{
  line-height:1.45;
  margin-bottom:12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-actions{
  display:flex;
  align-items:center;
  gap:5px;
}

.post-action{
  border:0;
  background:transparent;
  color:var(--text);
  padding:8px;
  border-radius:9px;
  font-size:18px;
}

.post-action:hover{
  background:var(--bg);
}

.post-action.active{
  font-weight:800;
}

.post-count{
  font-size:13px;
  color:var(--muted);
  margin-left:4px;
}

.comments{
  border-top:1px solid var(--border);
  padding-top:12px;
  margin-top:12px;
}

.comment{
  display:flex;
  gap:9px;
  margin-bottom:11px;
}

.comment-body{
  background:var(--bg);
  padding:9px 11px;
  border-radius:12px;
  flex:1;
}

.comment-user{
  font-size:13px;
  font-weight:700;
}

.comment-text{
  margin-top:3px;
  font-size:14px;
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.comment-form input{
  flex:1;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  padding:10px 12px;
  border-radius:12px;
  outline:none;
}

.comment-form button{
  border:0;
  background:var(--accent);
  color:var(--bg);
  border-radius:12px;
  padding:0 14px;
}

/* SEARCH */

.search-box{
  padding:16px;
  margin-bottom:16px;
}

.search-input{
  width:100%;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:13px;
  padding:13px 15px;
  outline:none;
}

.search-results{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.search-user{
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
}

/* PROFILE */

.profile-header{
  padding:24px;
}

.profile-top{
  display:flex;
  gap:20px;
  align-items:center;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  background:var(--border);
}

.profile-info{
  flex:1;
}

.profile-name{
  font-size:23px;
  font-weight:800;
}

.profile-handle{
  color:var(--muted);
  margin-top:4px;
}

.profile-bio{
  margin-top:10px;
  line-height:1.45;
}

.profile-actions{
  margin-top:15px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.profile-tabs{
  display:flex;
  border-top:1px solid var(--border);
  margin-top:24px;
}

.profile-tab{
  flex:1;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:14px;
  font-weight:700;
}

.profile-tab.active{
  color:var(--text);
  border-bottom:2px solid var(--text);
}

.profile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
  margin-top:12px;
}

.profile-grid-item{
  aspect-ratio:1;
  background:var(--border);
  overflow:hidden;
  cursor:pointer;
}

.profile-grid-item img,
.profile-grid-item video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* RIGHT */

.side-card{
  padding:16px;
}

.side-title{
  font-weight:800;
  margin-bottom:10px;
}

.side-text{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:20px;
  border:1px solid var(--border);
  box-shadow:0 20px 70px rgba(0,0,0,.3);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 20px;
  border-bottom:1px solid var(--border);
}

.modal-title{
  font-size:20px;
  font-weight:800;
}

.modal-close{
  border:0;
  background:transparent;
  color:var(--text);
  font-size:25px;
}

.modal-body{
  padding:20px;
}

.modal-footer{
  padding:16px 20px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  padding:14px;
  border-radius:13px;
  outline:none;
}

.file-input{
  width:100%;
  margin-top:12px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:var(--text);
  color:var(--bg);
  padding:12px 18px;
  border-radius:12px;
  z-index:300;
  font-size:14px;
  box-shadow:var(--shadow);
}

/* MOBILE */

.mobile-nav{
  display:none;
}

@media(max-width:1000px){
  .layout{
    grid-template-columns:190px minmax(0,1fr);
  }

  .rightbar{
    display:none;
  }
}

@media(max-width:700px){
  .topbar{
    padding:0 14px;
  }

  .top-logo{
    font-size:25px;
  }

  .layout{
    display:block;
    padding:78px 10px 78px;
  }

  .sidebar{
    display:none;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:62px;
    background:var(--card);
    border-top:1px solid var(--border);
    z-index:50;
    justify-content:space-around;
  }

  .mobile-nav button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:20px;
  }

  .mobile-nav button.active{
    color:var(--text);
  }

  .profile-top{
    flex-direction:column;
    text-align:center;
  }

  .profile-avatar{
    width:90px;
    height:90px;
  }

  .profile-actions{
    justify-content:center;
  }

  .profile-grid{
    gap:2px;
  }

  .auth-box{
    padding:24px;
  }
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="logo">Vibra</div>
    <div class="auth-subtitle" id="authSubtitle">
      Entre na sua conta
    </div>

    <input id="authEmail" class="input" type="email" placeholder="Seu e-mail">
    <input id="authPassword" class="input" type="password" placeholder="Sua senha">

    <button class="primary-btn" onclick="handleAuth()" id="authButton">
      Entrar
    </button>

    <div class="auth-switch">
      <span id="authSwitchText">Ainda não tem conta?</span>
      <button onclick="toggleAuthMode()" id="authSwitchButton">
        Criar conta
      </button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <header class="topbar">
    <div class="top-logo">Vibra</div>

    <div class="top-actions">
      <button class="icon-btn" onclick="showPage('home')" title="Início">⌂</button>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="Tema">☾</button>
      <button class="icon-btn" onclick="logout()" title="Sair">↪</button>
    </div>
  </header>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="nav">
        <button class="nav-btn active" data-page="home" onclick="showPage('home')">
          🏠 Início
        </button>

        <button class="nav-btn" data-page="search" onclick="showPage('search')">
          🔎 Buscar
        </button>

        <button class="nav-btn" data-page="create" onclick="openCreate()">
          ➕ Criar
        </button>

        <button class="nav-btn" data-page="profile" onclick="showPage('profile')">
          👤 Perfil
        </button>

        <button class="nav-btn" data-page="reposts" onclick="showPage('reposts')">
          🔄 Repostados
        </button>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- HOME -->
      <section id="page-home" class="page">

        <div class="card composer section">
          <div class="composer-row">
            <img id="quickAvatar" class="avatar" src="" alt="">
            <input
              class="composer-input"
              placeholder="No que você está pensando?"
              onclick="openCreate()"
              readonly
            >
          </div>

          <div class="composer-actions">
            <button class="secondary-btn" onclick="openCreate()">
              📷 Foto ou vídeo
            </button>

            <button class="secondary-btn" onclick="openCreate()">
              ✍️ Publicar
            </button>
          </div>
        </div>

        <div id="feed"></div>

      </section>

      <!-- SEARCH -->
      <section id="page-search" class="page hidden">

        <div class="card search-box">
          <input
            id="searchInput"
            class="search-input"
            placeholder="Pesquisar pessoas ou publicações..."
            oninput="searchEverything()"
          >
        </div>

        <div id="searchResults"></div>

      </section>

      <!-- PROFILE -->
      <section id="page-profile" class="page hidden">

        <div class="card profile-header">

          <div class="profile-top">
            <img id="profileAvatar" class="profile-avatar" src="" alt="">

            <div class="profile-info">
              <div id="profileName" class="profile-name"></div>
              <div id="profileUsername" class="profile-handle"></div>
              <div id="profileBio" class="profile-bio"></div>

              <div class="profile-actions">
                <button class="secondary-btn" onclick="openEditProfile()">
                  ✏️ Editar perfil
                </button>

                <button class="secondary-btn" onclick="showPage('reposts')">
                  🔄 Repostados
                </button>
              </div>
            </div>
          </div>

          <div class="profile-tabs">
            <button
              id="profileTabPosts"
              class="profile-tab active"
              onclick="profileTab('posts')"
            >
              Publicações
            </button>

            <button
              id="profileTabReposts"
              class="profile-tab"
              onclick="profileTab('reposts')"
            >
              Repostados
            </button>
          </div>

        </div>

        <div id="profileContent"></div>

      </section>

      <!-- REPOSTS -->
      <section id="page-reposts" class="page hidden">

        <div class="card" style="padding:18px;margin-bottom:18px;">
          <h2>Repostados</h2>
          <p style="color:var(--muted);margin-top:5px;">
            Publicações que você repostou aparecem somente aqui.
          </p>
        </div>

        <div id="repostsContent"></div>

      </section>

    </main>

    <!-- RIGHTBAR -->
    <aside class="rightbar">

      <div class="card side-card section">
        <div class="side-title">Sobre o Vibra</div>
        <div class="side-text">
          Compartilhe momentos, fotos, vídeos e descubra novas publicações.
        </div>
      </div>

      <div class="card side-card">
        <div class="side-title">Sua conta</div>
        <div id="sideAccount" class="side-text">
          Carregando...
        </div>
      </div>

    </aside>

  </div>

  <!-- MOBILE NAV -->
  <nav class="mobile-nav">
    <button data-mobile-page="home" onclick="showPage('home')">⌂</button>
    <button data-mobile-page="search" onclick="showPage('search')">⌕</button>
    <button onclick="openCreate()">＋</button>
    <button data-mobile-page="profile" onclick="showPage('profile')">♙</button>
    <button data-mobile-page="reposts" onclick="showPage('reposts')">↻</button>
  </nav>

</div>

<!-- CREATE MODAL -->
<div id="createModal" class="modal-backdrop hidden">

  <div class="modal">

    <div class="modal-header">
      <div class="modal-title">Criar publicação</div>

      <button class="modal-close" onclick="closeCreate()">
        ×
      </button>
    </div>

    <div class="modal-body">

      <textarea
        id="createCaption"
        class="textarea"
        placeholder="Escreva alguma coisa..."
      ></textarea>

      <input
        id="createFile"
        class="file-input"
        type="file"
        accept="image/*,video/*"
        onchange="previewCreateFile()"
      >

      <div id="createPreview" style="margin-top:14px;"></div>

    </div>

    <div class="modal-footer">
      <button class="secondary-btn" onclick="closeCreate()">
        Cancelar
      </button>

      <button class="primary-btn" style="width:auto;padding:11px 20px;" onclick="createPost()">
        Publicar
      </button>
    </div>

  </div>
</div>

<!-- EDIT PROFILE MODAL -->
<div id="editProfileModal" class="modal-backdrop hidden">

  <div class="modal">

    <div class="modal-header">
      <div class="modal-title">Editar perfil</div>

      <button class="modal-close" onclick="closeEditProfile()">
        ×
      </button>
    </div>

    <div class="modal-body">

      <input
        id="editDisplayName"
        class="input"
        placeholder="Nome"
      >

      <input
        id="editUsername"
        class="input"
        placeholder="Nome de usuário"
      >

      <textarea
        id="editBio"
        class="textarea"
        style="min-height:90px;"
        placeholder="Bio"
      ></textarea>

      <label style="display:block;margin-top:12px;font-weight:700;">
        Foto de perfil
      </label>

      <input
        id="editAvatar"
        class="file-input"
        type="file"
        accept="image/*"
      >

    </div>

    <div class="modal-footer">

      <button class="secondary-btn" onclick="closeEditProfile()">
        Cancelar
      </button>

      <button
        class="primary-btn"
        style="width:auto;padding:11px 20px;"
        onclick="saveProfile()"
      >
        Salvar
      </button>

    </div>

  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL = "https://dkkudlzpopmfhyqwjfsv.supabase.co";
const SUPABASE_KEY = "sb_publishable_r1YEZ_TDBIJsfZUKfVTLPQ_y2pTX6re";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let authMode = "login";
let currentProfile = null;
let currentProfileTab = "posts";

/* =========================================================
   UTIL
========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showToast(message){
  const toast = $("toast");

  toast.textContent = message;
  toast.classList.remove("hidden");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.classList.add("hidden");
  },3000);
}

function formatDate(date){
  if(!date) return "";

  const d = new Date(date);

  return d.toLocaleDateString("pt-BR",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}

function defaultAvatar(name="V"){
  const letter = String(name).trim().charAt(0).toUpperCase() || "V";

  return "https://ui-avatars.com/api/?name="
    + encodeURIComponent(letter)
    + "&background=777777&color=ffffff&bold=true";
}

/* =========================================================
   AUTH
========================================================= */

function toggleAuthMode(){

  authMode = authMode === "login"
    ? "signup"
    : "login";

  if(authMode === "signup"){

    $("authSubtitle").textContent =
      "Crie sua conta no Vibra";

    $("authButton").textContent =
      "Criar conta";

    $("authSwitchText").textContent =
      "Já tem uma conta?";

    $("authSwitchButton").textContent =
      "Entrar";

  }else{

    $("authSubtitle").textContent =
      "Entre na sua conta";

    $("authButton").textContent =
      "Entrar";

    $("authSwitchText").textContent =
      "Ainda não tem conta?";

    $("authSwitchButton").textContent =
      "Criar conta";
  }
}

async function handleAuth(){

  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;

  if(!email || !password){
    showToast("Preencha e-mail e senha.");
    return;
  }

  $("authButton").disabled = true;

  try{

    if(authMode === "login"){

      const {error} =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if(error) throw error;

    }else{

      const {data,error} =
        await supabaseClient.auth.signUp({
          email,
          password
        });

      if(error) throw error;

      if(data.session){
        currentUser = data.user;
        await enterApp();
      }else{

        showToast(
          "Conta criada! Verifique seu e-mail se necessário."
        );

        authMode = "login";
        toggleAuthMode();
      }
    }

  }catch(error){

    console.error(error);

    showToast(
      error.message || "Não foi possível continuar."
    );

  }finally{

    $("authButton").disabled = false;
  }
}

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;

  $("app").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
}

async function ensureProfile(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(!data){

    const usernameBase =
      (currentUser.email || "usuario")
      .split("@")[0]
      .replace(/[^a-zA-Z0-9_]/g,"")
      .slice(0,20) || "usuario";

    const {error:createError} =
      await supabaseClient
        .from("profiles")
        .insert({
          id:currentUser.id,
          username:
            usernameBase +
            "_" +
            Math.floor(Math.random()*9999),
          display_name:
            currentUser.email?.split("@")[0] || "Usuário",
          bio:"",
          avatar_url:""
        });

    if(createError){
      console.error(createError);
    }
  }
}

async function loadProfile(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  currentProfile = data;

  const name =
    data?.display_name ||
    currentUser.email?.split("@")[0] ||
    "Usuário";

  const username =
    data?.username
      ? "@" + data.username

  $("profileUsername").textContent = username;
  $("profileBio").textContent = data?.bio || "";

  $("profileAvatar").src = avatar;
  $("quickAvatar").src = avatar;

  $("sideAccount").innerHTML =
    `<strong>${escapeHtml(name)}</strong><br>
     ${escapeHtml(username)}`;

}

async function saveProfile(){

  const displayName =
    $("editDisplayName").value.trim();

  const username =
    $("editUsername").value.trim();

  const bio =
    $("editBio").value.trim();

function showPage(page){

    .forEach(el=>{

    $("page-" + page);

  if(target){
    target.classList.remove("hidden");

  document.querySelectorAll(".nav-btn")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",

    });

  document.querySelectorAll(".mobile-nav button")
    .forEach(btn=>{
      btn.classList.toggle(

/* =========================================================
   BUILD POST
========================================================= */

async function buildPost(post){

  const profile =
    post.profiles || {};

  const name =
    profile.display_name ||
    profile.username ||
    "Usuário";

  const username =
    profile.username
      ? "@" + profile.username
      : "";

  const avatar =
    profile.avatar_url ||
    defaultAvatar(name);

  const {count:likesCount} =
    await supabaseClient
      .from("likes")
      .select("*",{count:"exact",head:true})
      .eq("post_id",post.id);

  const {data:myLike} =
    await supabaseClient
      .from("likes")
      .select("id")
      .eq("post_id",post.id)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  const {count:commentsCount} =
    await supabaseClient
      .from("comments")
      .select("*",{count:"exact",head:true})
      .eq("post_id",post.id);

  const {data:myRepost} =
    await supabaseClient
      .from("reposts")
      .select("id")
      .eq("post_id",post.id)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  let media = "";

  if(post.media_url){

    if(post.media_type === "video"){

      media =
        `<video
          class="post-media"
          src="${escapeHtml(post.media_url)}"
          controls
          playsinline
        ></video>`;

    }else{

      media =
        `<img
          class="post-media"
          src="${escapeHtml(post.media_url)}"
          alt="Publicação"
        >`;
    }
  }

  const ownPost =
    post.user_id === currentUser.id;

  return `
    <article class="card post" id="post-${post.id}">

      <div class="post-header">

        <div class="post-user">

          <img
            class="avatar small"
            src="${escapeHtml(avatar)}"
            alt=""
          >

          <div class="post-user-info">

            <span class="username">
              ${escapeHtml(name)}
            </span>

            <span class="post-time">
              ${escapeHtml(username)}
              ·
              ${formatDate(post.created_at)}
            </span>

          </div>

        </div>

        <button
          class="post-menu"
          onclick="sharePost('${post.id}')"
        >
          ⋯
        </button>

      </div>

      ${media}

      <div class="post-content">

        ${
          post.caption
            ? `<div class="post-caption">
                ${escapeHtml(post.caption)}
              </div>`
            : ""
        }

        <div class="post-actions">

          <button
            class="post-action ${myLike ? "active" : ""}"
            onclick="toggleLike('${post.id}')"
          >
            ${myLike ? "❤️" : "♡"}
          </button>

          <span class="post-count">
            ${likesCount || 0}
          </span>

          <button
            class="post-action"
            onclick="toggleComments('${post.id}')"
          >
            💬
          </button>

          <span class="post-count">
            ${commentsCount || 0}
          </span>

          <button
            class="post-action ${myRepost ? "active" : ""}"
            onclick="toggleRepost('${post.id}')"
          >
            🔄
          </button>

          <button
            class="post-action"
            onclick="sharePost('${post.id}')"
          >
            ↗
          </button>

          ${
            ownPost
              ? `<button
                   class="post-action"
                   onclick="deletePost('${post.id}')"
                 >
                   🗑️
                 </button>`
              : ""
          }

        </div>

        <div
          id="comments-${post.id}"
          class="comments hidden"
        ></div>

      </div>

    </article>
  `;
}

   CREATE POST
========================================================= */

function openCreate(){
  $("createModal").classList.remove("hidden");
  $("createCaption").focus();
}

function closeCreate(){

  $("createModal").classList.add("hidden");

  $("createCaption").value = "";
  $("createFile").value = "";
  $("createPreview").innerHTML = "";
}

function previewCreateFile(){

  const file =
    $("createFile").files[0];

  if(!file){
    $("createPreview").innerHTML = "";
    return;
  }

  const url =
    URL.createObjectURL(file);

  if(file.type.startsWith("video/")){

    $("createPreview").innerHTML =
      `<video
        src="${url}"
        controls
        style="width:100%;max-height:400px;border-radius:13px;background:#000;"
      ></video>`;

  }else{

    $("createPreview").innerHTML =
      `<img
        src="${url}"
        style="width:100%;max-height:400px;object-fit:contain;border-radius:13px;"
      >`;
  }
}

async function createPost(){

  if(!currentUser) return;

  const caption =
    $("createCaption").value.trim();

  const file =
    $("createFile").files[0];

  if(!caption && !file){

    showToast(
      "Escreva algo ou escolha uma foto/vídeo."
    );

    return;
  }

  try{

    let mediaUrl = "";
    let mediaType = "";

    if(file){

      if(file.size > 2 * 1024 * 1024){

        showToast(
          "Por enquanto, o arquivo precisa ter até 2 MB."
        );

        return;
      }

      mediaUrl =
        await fileToDataURL(file);

      mediaType =
        file.type.startsWith("video/")
          ? "video"
          : "image";
    }

    const {error} =
      await supabaseClient
        .from("posts")
        .insert({
          user_id:currentUser.id,
          caption,
          media_url:mediaUrl,
          media_type:mediaType
        });

    if(error) throw error;

    closeCreate();

    showToast("Publicação criada! ✨");

    await loadFeed();

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Não foi possível publicar."
    );
  }
}

function fileToDataURL(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload =
      ()=>resolve(reader.result);

    reader.onerror =
      ()=>reject(reader.error);

    reader.readAsDataURL(file);
  });
}

async function toggleLike(postId){

  if(!currentUser) return;

  const {data:existing,error:checkError} =
    await supabaseClient
      .from("likes")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(checkError){
    showToast(checkError.message);
    return;
  }

  if(existing){

    const {error} =
      await supabaseClient
        .from("likes")
        .delete()
        .eq("id",existing.id);

    if(error){
      showToast(error.message);
      return;
    }

  }else{

    const {error} =
      await supabaseClient
        .from("likes")
        .insert({
          post_id:postId,
          user_id:currentUser.id
        });

    if(error){
      showToast(error.message);
      return;
    }
  }

  await loadFeed();
}

async function toggleComments(postId){

  const box =
    $("comments-" + postId);

  if(!box) return;

  if(!box.classList.contains("hidden")){

    box.classList.add("hidden");
    return;
  }

  box.classList.remove("hidden");

  await loadComments(postId);
}

async function loadComments(postId){

  const box =
    $("comments-" + postId);

  if(!box) return;

  box.innerHTML =
    `<div style="color:var(--muted);padding:5px;">
      Carregando comentários...
    </div>`;

  const {data,error} =
    await supabaseClient
      .from("comments")
      .select(`
        *,
        profiles:user_id(
          username,
          display_name,
          avatar_url
        )
      `)
      .eq("post_id",postId)
      .order("created_at",{ascending:true});

  if(error){

    console.error(error);

    box.innerHTML =
      `<div style="color:var(--muted);">
        Não foi possível carregar os comentários.
      </div>`;

    return;
  }

  let html = "";

  if(!data || !data.length){

    html +=
      `<div style="color:var(--muted);margin-bottom:10px;">
        Ainda não há comentários.
      </div>`;
  }

  for(const comment of data){

    const p =
      comment.profiles || {};

    const name =
      p.display_name ||
      p.username ||
      "Usuário";

    const avatar =
      p.avatar_url ||
      defaultAvatar(name);

    html += `
      <div class="comment">

        <img
          class="avatar small"
          src="${escapeHtml(avatar)}"
          alt=""
        >

        <div class="comment-body">

          <div class="comment-user">
            ${escapeHtml(name)}
          </div>

          <div class="comment-text">
            ${escapeHtml(comment.content || "")}
          </div>

        </div>

      </div>
    `;
  }

  html += `
    <div class="comment-form">

      <input
        id="comment-input-${postId}"
        placeholder="Escreva um comentário..."
        onkeydown="if(event.key==='Enter') addComment('${postId}')"
      >

      <button onclick="addComment('${postId}')">
        Enviar
      </button>

    </div>
  `;

  box.innerHTML = html;
}

async function addComment(postId){

  const input =
    $("comment-input-" + postId);

  if(!input) return;

  const content =
    input.value.trim();

  if(!content) return;

  const {error} =
    await supabaseClient
      .from("comments")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        content
      });

  if(error){

    showToast(error.message);
    return;
  }

  input.value = "";

  await loadComments(postId);
}

========================================================= */

async function deletePost(postId){

  if(!currentUser) return;

  const confirmDelete =
    confirm("Excluir esta publicação?");

  if(!confirmDelete) return;

  try{

    await supabaseClient
      .from("likes")
      .delete()
      .eq("post_id",postId);

    await supabaseClient
      .from("comments")
      .delete()
      .eq("post_id",postId);

    await supabaseClient
      .from("reposts")
      .delete()
      .eq("post_id",postId);

    const {error} =
      await supabaseClient
        .from("posts")
        .delete()
        .eq("id",postId)
        .eq("user_id",currentUser.id);

    if(error) throw error;

    showToast("Publicação excluída.");

    await loadFeed();

  }catch(error){

    console.error(error);

    showToast(
      error.message ||
      "Não foi possível excluir a publicação."
    );
  }
}

        behavior:"smooth",

/* =========================================================
   REPOSTS
========================================================= */

async function loadMyReposts(inProfile=false){

  const target =
    inProfile
      ? $("profileContent")
      : $("repostsContent");

  if(!target) return;

  const {data:reposts,error} =
    await supabaseClient
      .from("reposts")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    target.innerHTML =
      `<div class="card" style="padding:20px;">
        Não foi possível carregar seus reposts.
      </div>`;

    return;
  }

  if(!reposts || !reposts.length){

    target.innerHTML =
      `<div class="card" style="padding:35px;text-align:center;">
        Você ainda não repostou nenhuma publicação.
      </div>`;

    return;
  }

  const ids =
    reposts.map(item=>item.post_id);

  const {data:posts,error:postsError} =
    await supabaseClient
      .from("posts")
      .select(`
        *,
        profiles:user_id(
          id,
          username,
          display_name,
          avatar_url
        )
      `)
      .in("id",ids)
      .order("created_at",{ascending:false});

  if(postsError){

    console.error(postsError);

    target.innerHTML =
      `<div class="card" style="padding:20px;">
        Não foi possível carregar as publicações repostadas.
      </div>`;

    return;
  }

  const html = [];

  for(const post of posts || []){
    html.push(await buildPost(post));
  }

  target.innerHTML =
    html.length
      ? html.join("")
      : `<div class="card" style="padding:35px;text-align:center;">
           Os posts repostados não estão mais disponíveis.
         </div>`;
}

/* =========================================================
   SEARCH
========================================================= */

let searchTimer;

function searchEverything(){

  clearTimeout(searchTimer);

  searchTimer =
    setTimeout(runSearch,250);
}

async function runSearch(){

  const q =
    $("searchInput").value.trim();

  const results =
    $("searchResults");

  if(!q){

    results.innerHTML = "";
    return;
  }

  results.innerHTML =
    `<div class="card" style="padding:20px;color:var(--muted);">
      Buscando...
    </div>`;

  const safe =
    q.replace(/[%_,]/g," ");

  const {data:profiles,error:profilesError} =
    await supabaseClient
      .from("profiles")
      .select("id,username,display_name,avatar_url")
      .or(
        `username.ilike.%${safe}%,display_name.ilike.%${safe}%`
      )
      .limit(10);

  const {data:posts,error:postsError} =
    await supabaseClient
      .from("posts")
      .select(`
        *,
        profiles:user_id(
          id,
          username,
          display_name,
          avatar_url
        )
      `)
      .ilike("caption",`%${safe}%`)
      .order("created_at",{ascending:false})
      .limit(15);

  let html = "";

  if(profiles && profiles.length){

    html += `
      <div style="font-weight:800;margin:0 0 10px;">
        Pessoas
      </div>
    `;

    for(const p of profiles){

      const name =
        p.display_name ||
        p.username ||
        "Usuário";

      html += `
        <div class="card search-user">

          <img
            class="avatar"
            src="${escapeHtml(
              p.avatar_url || defaultAvatar(name)
            )}"
          >

          <div>
            <strong>${escapeHtml(name)}</strong>

            <div style="color:var(--muted);font-size:13px;">
              @${escapeHtml(p.username || "")}
            </div>
          </div>

        </div>
      `;
    }
  }

  if(posts && posts.length){

    html += `
      <div style="font-weight:800;margin:20px 0 10px;">
        Publicações
      </div>
    `;

    for(const post of posts){

      html += await buildPost(post);
    }
  }

  if(!html){

    html =
      `<div class="card" style="padding:30px;text-align:center;color:var(--muted);">
        Nenhum resultado encontrado.
      </div>`;
  }

  results.innerHTML = html;
}

/* =========================================================
   SHARE
========================================================= */

async function sharePost(postId){

  const url =
    window.location.origin +
    window.location.pathname +
    "?post=" +
    encodeURIComponent(postId);

  try{

    if(navigator.share){

      await navigator.share({
        title:"Vibra",
        text:"Confira esta publicação no Vibra!",
        url
      });

    }else{

      await navigator.clipboard.writeText(url);

      showToast("Link copiado!");

    }

  }catch(error){

    if(error?.name !== "AbortError"){
      console.error(error);
    }
  }
}

/* =========================================================
   THEME
========================================================= */

function toggleTheme(){

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  localStorage.setItem(
    "vibra_theme",
    dark ? "dark" : "light"
  );

  $("themeBtn").textContent =
    dark ? "☀" : "☾";
}

function loadTheme(){

  const theme =
    localStorage.getItem("vibra_theme");

  if(theme === "dark"){

    document.body.classList.add("dark");

    $("themeBtn").textContent = "☀";

  }else{

    $("themeBtn").textContent = "☾";
  }
}

/* =========================================================
   START
========================================================= */

loadTheme();
checkSession();
