<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibra</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f4f5f6;
  --surface:#ffffff;
  --surface2:#f0f2f3;
  --text:#101114;
  --muted:#7e858d;
  --border:#e0e4e7;
  --accent:#ff5a2f;
  --accent2:#a66cff;
  --pink:#ff3f72;
  --danger:#ed4956;
}

body.dark{
  --bg:#050a0c;
  --surface:#081115;
  --surface2:#102027;
  --text:#f6f8f9;
  --muted:#8e9ba3;
  --border:#1c3038;
  --accent:#ff6438;
  --accent2:#a878ff;
  --pink:#ff3e70;
  --shadow:0 14px 40px rgba(0,0,0,.35);
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:58px;
  padding:0 18px;
  background:rgba(5,10,12,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:50;
}

body:not(.dark) .topbar{
  background:rgba(255,255,255,.94);
}

.logo{
  font-family:Georgia,serif;
  font-style:italic;
  font-size:25px;
  letter-spacing:-1.5px;
  font-weight:800;
}

.top-actions{
  display:flex;
  gap:2px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:var(--surface2);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.top-icon{
  background:transparent!important;
  font-size:22px;
  width:38px;
  height:38px;
}

.layout{
  width:min(980px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:180px minmax(0,560px);
  gap:28px;
  padding:78px 14px 90px;
}

.sidebar{
  position:sticky;
  top:76px;
  height:max-content;
}

.nav-item{
  width:100%;
  padding:12px 14px;
  border:0;
  background:transparent;
  color:var(--text);
  text-align:left;
  border-radius:14px;
  margin-bottom:5px;
  font-size:14px;
}

.nav-item:hover,
.nav-item.active{
  background:var(--surface2);
  font-weight:700;
}

main{
  min-width:0;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:none;
}

.primary{
  border:0;
  background:var(--accent);
  color:white;
  padding:10px 17px;
  border-radius:10px;
  font-weight:700;
}

.secondary{
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  padding:9px 13px;
  border-radius:10px;
}

.hidden{
  display:none!important;
}

.stories-bar{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding:12px 10px;
  margin-bottom:10px;
  background:transparent;
  border:0;
  box-shadow:none;
}

.stories-bar::-webkit-scrollbar{
  display:none;
}

.story-item{
  border:0;
  background:transparent;
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  min-width:66px;
  font-size:11px;
}

.story-ring{
  width:56px;
  height:56px;
  border-radius:50%;
  padding:2px;
  background:linear-gradient(135deg,#ffb52e,#ff3c68,#9d67ff);
  display:flex;
  align-items:center;
  justify-content:center;
}

.story-ring:before{
  content:"";
  width:100%;
  height:100%;
  border-radius:50%;
  background:var(--surface);
}

.story-ring.own{
  background:var(--border);
}

.story-plus{
  position:absolute;
  z-index:2;
  width:25px;
  height:25px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--accent);
  color:white;
  font-size:19px;
  border:2px solid var(--surface);
}

.composer{
  padding:18px;
  margin-bottom:18px;
}

.composer textarea{
  width:100%;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:var(--text);
  min-height:70px;
  font-size:16px;
}

.composer-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid var(--border);
  padding-top:12px;
  margin-top:10px;
}

.post{
  overflow:hidden;
  margin-bottom:18px;
}

.post-head{
  display:flex;
  align-items:center;
  gap:11px;
  padding:15px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--surface2);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
  font-weight:700;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-info{
  flex:1;
}

.username{
  font-weight:700;
}

.date{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.post-content{
  padding:0 15px 15px;
  line-height:1.5;
  white-space:pre-wrap;
}

.post-media{
  width:100%;
  max-height:700px;
  display:block;
  object-fit:contain;
  background:#000;
}

.post-actions{
  display:flex;
  gap:5px;
  padding:10px 12px;
  border-top:1px solid var(--border);
}

.action{
  border:0;
  background:transparent;
  color:var(--text);
  padding:9px 10px;
  border-radius:9px;
}

.action:hover{
  background:var(--surface2);
}

.action.liked{
  color:var(--danger);
}

.comments{
  padding:0 15px 15px;
}

.comment{
  padding:7px 0;
  font-size:14px;
}

.comment b{
  margin-right:5px;
}

.comment-form{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.comment-form input{
  flex:1;
  background:var(--surface2);
  color:var(--text);
  border:0;
  outline:0;
  border-radius:9px;
  padding:9px 11px;
}

.right{
  display:none;
}

.right-card{
  padding:18px;
}

.right-title{
  font-weight:800;
  margin-bottom:13px;
}

.search-box{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.search-box input{
  width:100%;
  padding:11px 13px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  outline:none;
}

.profile{
  padding:22px;
  margin-bottom:18px;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile .avatar{
  width:75px;
  height:75px;
  font-size:25px;
}

.profile-name{
  font-size:22px;
  font-weight:800;
}

.profile-bio{
  margin-top:13px;
  color:var(--muted);
}

.tabs{
  display:flex;
  border-bottom:1px solid var(--border);
  margin-top:20px;
}

.tab{
  flex:1;
  padding:12px;
  border:0;
  background:transparent;
  color:var(--muted);
}

.tab.active{
  color:var(--text);
  font-weight:700;
  border-bottom:2px solid var(--text);
}

.empty{
  text-align:center;
  padding:55px 20px;
  color:var(--muted);
}

.login{
  width:min(420px,calc(100% - 30px));
  margin:80px auto;
  padding:30px;
}

.login h1{
  font-size:30px;
  margin-bottom:8px;
}

.login p{
  color:var(--muted);
  margin-bottom:22px;
}

.field{
  margin-bottom:12px;
}

.field input{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--surface);
  color:var(--text);
  outline:none;
}

.login .primary{
  width:100%;
  margin-top:5px;
}

.switch{
  text-align:center;
  margin-top:16px;
  color:var(--muted);
  font-size:14px;
}

.switch button{
  border:0;
  background:none;
  color:var(--text);
  font-weight:700;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px;
}

.modal-bg.open{
  display:flex;
}

.modal{
  width:min(520px,100%);
  background:var(--surface);
  color:var(--text);
  border-radius:20px;
  padding:22px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal textarea{
  width:100%;
  min-height:130px;
  resize:vertical;
  padding:12px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  border-radius:11px;
  outline:none;
}

.modal-footer{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:12px;
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:12px 18px;
  border-radius:12px;
  display:none;
  z-index:200;
}

.toast.show{
  display:block;
}

.mobile-nav{
  display:none;
}
