<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vibra</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#fff;
  --surface:#fff;
  --text:#111;
  --muted:#737373;
  --line:#e9e9e9;
  --soft:#f6f6f6;
  --accent:#111;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body.dark{
  --bg:#000;
  --surface:#000;
  --text:#fff;
  --muted:#9b9b9b;
  --line:#252525;
  --soft:#111;
  --accent:#fff;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* AUTH */
.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:var(--bg);
}
.auth-box{
  width:min(390px,100%);
  border:1px solid var(--line);
  padding:32px 24px;
  border-radius:20px;
  background:var(--surface);
}
.auth-logo{
  text-align:center;
  font-size:34px;
  font-weight:800;
  letter-spacing:-1.8px;
  margin-bottom:8px;
}
.auth-sub{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:25px;
}
.auth input{
  width:100%;
  height:46px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--soft);
  color:var(--text);
  padding:0 13px;
  margin-bottom:10px;
  outline:none;
}
.auth-main{
  width:100%;
  height:46px;
  border:0;
  border-radius:10px;
  background:var(--accent);
  color:var(--bg);
  font-weight:700;
}
.auth-switch{
  margin-top:18px;
  text-align:center;
  font-size:14px;
  color:var(--muted);
}
.auth-switch button{
  border:0;background:none;color:var(--text);font-weight:700;
}

/* APP SHELL */
.app{min-height:100vh;background:var(--bg)}
.mobile-shell{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  background:var(--surface);
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}
.header{
  position:sticky;
  top:0;
  z-index:30;
  height:53px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
}
.dark .header{background:rgba(0,0,0,.96)}
.brand{
  font-size:23px;
  line-height:1;
  font-weight:800;
  letter-spacing:-1.3px;
}
.header-actions{display:flex;gap:5px}
.header-btn{
  width:35px;height:35px;border:0;background:none;color:var(--text);
  display:grid;place-items:center;font-size:22px;
}

/* STORIES */
.stories-wrap{
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.stories{
  display:flex;
  gap:13px;
  overflow-x:auto;
  padding:10px 11px 9px;
  scrollbar-width:none;
}
.stories::-webkit-scrollbar{display:none}
.story{
  width:61px;
  flex:0 0 61px;
  text-align:center;
  font-size:10px;
  color:var(--text);
}
.story-ring{
  width:56px;height:56px;
  margin:0 auto 4px;
  padding:2px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff6a00,#ff1875,#8c42ff);
}
.story-ring.me{
  background:var(--line);
}
.story-inner{
  width:100%;height:100%;
  border-radius:50%;
  padding:2px;
  background:var(--surface);
}
.story-inner img{
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
}
.story-plus{
  position:relative;
}
.story-plus::after{
  content:"+";
  position:absolute;
  right:1px;
  bottom:0;
  width:17px;height:17px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#1677ff;
  color:#fff;
  border:2px solid var(--surface);
  font-size:13px;
  font-weight:bold;
}

/* FEED */
.feed{background:var(--surface)}
.post{
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.post-head{
  height:53px;
  padding:7px 11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.post-user{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}
.post-avatar{
  width:36px;height:36px;border-radius:50%;
  object-fit:cover;background:var(--soft);
  flex:0 0 36px;
}
.post-user-text{min-width:0}
.post-name{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.post-meta{
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
}
.more{
  border:0;background:none;color:var(--text);font-size:19px;padding:5px;
}
.media{
  width:100%;
  display:block;
  background:#ededed;
  object-fit:cover;
  max-height:720px;
}
.post-body{padding:8px 11px 12px}
.actions{
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:6px;
}
.action{
  border:0;background:none;color:var(--text);
  width:31px;height:31px;
  display:grid;place-items:center;
  font-size:22px;
  padding:0;
}
.action.repost{font-size:20px}
.action.share{font-size:21px}
.action.active{font-weight:700}
.likes{
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}
.caption{
  font-size:12px;
  line-height:1.4;
  word-break:break-word;
}
.caption strong{margin-right:4px}
.view-comments{
  border:0;background:none;color:var(--muted);
  font-size:12px;padding:5px 0;
}
.comment-box{
  display:flex;
  gap:7px;
  padding-top:7px;
}
.comment-box input{
  flex:1;height:33px;
  border:1px solid var(--line);
  background:var(--soft);
  color:var(--text);
  border-radius:17px;
  padding:0 12px;
  outline:none;
  font-size:12px;
}
.comment-box button{
  border:0;background:var(--accent);color:var(--bg);
  border-radius:17px;padding:0 11px;font-size:11px;font-weight:700;
}
.comments-list{padding-top:6px}
.comment{
  display:flex;gap:7px;margin:6px 0;
}
.comment img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.comment-content{
  background:var(--soft);
  border-radius:10px;
  padding:6px 9px;
  font-size:11px;
}
.comment-content strong{display:block;margin-bottom:2px}

/* PAGES */
.page{min-height:calc(100vh - 53px);padding-bottom:66px}
.page-title{
  height:48px;
  display:flex;
  align-items:center;
  padding:0 14px;
  font-size:18px;
  font-weight:800;
  border-bottom:1px solid var(--line);
}
.search-page{padding:10px 11px 70px}
.search-input{
  width:100%;height:38px;
  border:0;border-radius:9px;
  background:var(--soft);
  color:var(--text);
  padding:0 13px;
  outline:none;
  font-size:13px;
}
.search-title{font-size:12px;font-weight:700;margin:17px 3px 8px}
.search-person{
  display:flex;align-items:center;gap:10px;
  padding:9px 2px;
}
.search-person img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.search-person-name{font-size:13px;font-weight:700}
.search-person-user{font-size:11px;color:var(--muted);margin-top:2px}

/* PROFILE */
.profile-top{
  padding:20px 15px 13px;
}
.profile-main{
  display:flex;
  align-items:center;
  gap:18px;
}
.profile-avatar{
  width:84px;height:84px;border-radius:50%;
  object-fit:cover;background:var(--soft);
}
.profile-data{flex:1}
.profile-name{font-size:18px;font-weight:800}
.profile-user{font-size:12px;color:var(--muted);margin-top:3px}
.profile-bio{font-size:12px;line-height:1.4;margin-top:8px}
.profile-buttons{display:flex;gap:7px;margin-top:11px}
.profile-button{
  height:32px;padding:0 14px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--surface);
  color:var(--text);
  font-size:11px;font-weight:700;
}
.profile-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  height:45px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.profile-tab{
  border:0;background:none;color:var(--muted);
  font-size:18px;
}
.profile-tab.active{
  color:var(--text);
  border-bottom:2px solid var(--text);
}
.profile-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}
.grid-item{
  aspect-ratio:1;
  background:var(--soft);
  overflow:hidden;
}
.grid-item img,.grid-item video{
  width:100%;height:100%;object-fit:cover;display:block;
}
.grid-text{
  height:100%;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:11px;
}

/* CREATE */
.create{
  padding:15px 12px 80px;
}
.create-user{
  display:flex;align-items:center;gap:9px;margin-bottom:12px;
}
.create-user img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.create textarea{
  width:100%;
  min-height:125px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:5px 0;
}
.create-preview{margin-top:10px}
.create-preview img,.create-preview video{
  width:100%;max-height:520px;object-fit:contain;background:#000;border-radius:8px;
}
.create-tools{
  border-top:1px solid var(--line);
  margin-top:12px;padding-top:12px;
  display:flex;justify-content:space-between;align-items:center;
}
.file-button{
  border:0;background:none;color:var(--text);font-size:20px;
}
.publish-button{
  border:0;background:var(--accent);color:var(--bg);
  border-radius:8px;padding:8px 16px;font-weight:700;font-size:12px;
}

/* BOTTOM NAV */
.bottom{
  position:fixed;
  z-index:40;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(620px,100%);
  height:56px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.98);
  border-top:1px solid var(--line);
}
.dark .bottom{background:rgba(0,0,0,.98)}
.bottom button{
  border:0;background:none;color:var(--text);
  display:grid;place-items:center;
  font-size:22px;
}
.bottom button.active{font-weight:800}

/* MODAL EDIT */
.modal{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.55);
  display:grid;place-items:center;padding:15px;
}
.modal-box{
  width:min(420px,100%);
  background:var(--surface);
  border-radius:15px;
  overflow:hidden;
}
.modal-head{
  height:50px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;font-weight:800;
}
.modal-head button{
  border:0;background:none;color:var(--text);font-size:22px;
}
.modal-body{padding:15px}
.modal-body input,.modal-body textarea{
  width:100%;border:1px solid var(--line);background:var(--soft);
  color:var(--text);border-radius:9px;padding:11px;margin-bottom:9px;outline:none;
}
.modal-body textarea{min-height:90px;resize:none}
.modal-foot{padding:12px 15px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.save{
  border:0;background:var(--accent);color:var(--bg);
  border-radius:8px;padding:9px 17px;font-weight:700;
}
.toast{
  position:fixed;z-index:200;bottom:70px;left:50%;
  transform:translateX(-50%);
  background:var(--text);color:var(--bg);
  padding:9px 14px;border-radius:9px;font-size:12px;
}

/* DESKTOP: keep app narrow like the mobile reference */
@media(min-width:800px){
  body{background:#f1f1f1}
  body.dark{background:#050505}
  .mobile-shell{box-shadow:0 0 0 1px var(--line)}
}
</style>
</head>

<body>

<div id="auth" class="auth">
  <div class="auth-box">
    <div class="auth-logo">Vibra</div>
    <div id="authSub" class="auth-sub">Entre na sua conta</div>
    <input id="email" type="email" placeholder="E-mail">
    <input id="password" type="password" placeholder="Senha">
    <button id="authBtn" class="auth-main" onclick="authAction()">Entrar</button>
    <div class="auth-switch">
      <span id="switchText">Ainda não tem conta?</span>
      <button onclick="toggleAuth()">Criar conta</button>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="mobile-shell">

    <header class="header">
      <div class="brand">Vibra</div>
      <div class="header-actions">
        <button class="header-btn" onclick="showPage('home')" aria-label="Notificações">♡</button>
        <button class="header-btn" onclick="showPage('messages')" aria-label="Mensagens">♧</button>
      </div>
    </header>

    <main>
      <!-- HOME -->
      <section id="homePage" class="page">
        <div class="stories-wrap">
          <div id="stories" class="stories"></div>
        </div>
        <div id="feed" class="feed"></div>
      </section>

      <!-- SEARCH -->
      <section id="searchPage" class="page hidden">
        <div class="page-title">Buscar</div>
        <div class="search-page">
          <input id="searchInput" class="search-input" placeholder="Pesquisar..." oninput="searchEverything()">
          <div id="searchResults"></div>
        </div>
      </section>

      <!-- CREATE -->
      <section id="createPage" class="page hidden">
        <div class="page-title">Nova publicação</div>
        <div class="create">
          <div class="create-user">
            <img id="createAvatar" src="">
            <strong id="createName">Você</strong>
          </div>
          <textarea id="caption" placeholder="No que você está pensando?"></textarea>
          <div id="preview" class="create-preview"></div>
          <div class="create-tools">
            <label class="file-button" title="Adicionar foto ou vídeo">
              📷
              <input id="mediaFile" type="file" accept="image/*,video/*" hidden onchange="previewMedia()">
            </label>
            <button class="publish-button" onclick="publish()">Publicar</button>
          </div>
        </div>
      </section>

      <!-- PROFILE -->
      <section id="profilePage" class="page hidden">
        <div class="profile-top">
          <div class="profile-main">
            <img id="profileAvatar" class="profile-avatar" src="">
            <div class="profile-data">
              <div id="profileName" class="profile-name"></div>
              <div id="profileUsername" class="profile-user"></div>
              <div id="profileBio" class="profile-bio"></div>
            </div>
          </div>
          <div class="profile-buttons">
            <button class="profile-button" onclick="openEdit()">Editar perfil</button>
          </div>
        </div>

        <div class="profile-tabs">
          <button class="profile-tab active" id="tabPosts" onclick="profileTab('posts')">▦</button>
          <button class="profile-tab" id="tabReels" onclick="profileTab('reels')">▤</button>
          <button class="profile-tab" id="tabReposts" onclick="profileTab('reposts')">↻</button>
          <button class="profile-tab" id="tabSaved" onclick="profileTab('saved')">♡</button>
        </div>

        <div id="profileGrid" class="profile-grid"></div>
      </section>

      <!-- MESSAGES -->
      <section id="messagesPage" class="page hidden">
        <div class="page-title">Mensagens</div>
        <div style="padding:25px 15px;text-align:center;color:var(--muted);font-size:13px;">
          Suas conversas aparecerão aqui.
        </div>
      </section>
    </main>

  </div>

  <nav class="bottom">
    <button id="navHome" class="active" onclick="showPage('home')">⌂</button>
    <button id="navSearch" onclick="showPage('search')">⌕</button>
    <button id="navCreate" onclick="showPage('create')">＋</button>
    <button id="navReels" onclick="showPage('messages')">▣</button>
    <button id="navProfile" onclick="showPage('profile')">♙</button>
  </nav>
</div>

<div id="editModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>Editar perfil</span>
      <button onclick="closeEdit()">×</button>
    </div>
    <div class="modal-body">
      <input id="editName" placeholder="Nome">
      <input id="editUsername" placeholder="Nome de usuário">
      <textarea id="editBio" placeholder="Bio"></textarea>
      <input id="editAvatar" type="file" accept="image/*">
    </div>
    <div class="modal-foot">
      <button class="save" onclick="saveProfile()">Salvar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL="https://dkkudlzpopmfhyqwjfsv.supabase.co";
const SUPABASE_KEY="sb_publishable_r1YEZ_TDBIJsfZUKfVTLPQ_y2pTX6re";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user=null;
let profile=null;
let authMode="login";

const $=id=>document.getElementById(id);

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
function avatar(name){
  return "https://ui-avatars.com/api/?name="+encodeURIComponent((name||"V").slice(0,1))+"&background=777&color=fff";
}
function toast(t){
  $("toast").textContent=t;
  $("toast").classList.remove("hidden");
  clearTimeout(window._toast);
  window._toast=setTimeout(()=>$("toast").classList.add("hidden"),2500);
}
function date(v){
  if(!v)return"";
  return new Date(v).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
}

function toggleAuth(){
  authMode=authMode==="login"?"signup":"login";
  $("authSub").textContent=authMode==="login"?"Entre na sua conta":"Crie sua conta no Vibra";
  $("authBtn").textContent=authMode==="login"?"Entrar":"Criar conta";
  $("switchText").textContent=authMode==="login"?"Ainda não tem conta?":"Já tem uma conta?";
  document.querySelector(".auth-switch button").textContent=authMode==="login"?"Criar conta":"Entrar";
}

async function authAction(){
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||!password)return toast("Preencha e-mail e senha.");

  try{
    if(authMode==="login"){
      const {error}=await db.auth.signInWithPassword({email,password});
      if(error)throw error;
    }else{
      const {data,error}=await db.auth.signUp({email,password});
      if(error)throw error;
      if(!data.session)toast("Conta criada! Verifique seu e-mail.");
    }
  }catch(e){toast(e.message||"Não foi possível continuar.");}
}

db.auth.onAuthStateChange((event,session)=>{
  setTimeout(()=>{
    if(session){user=session.user;enter();}
    else{user=null;showAuth();}
  },0);
});

async function check(){
  const {data}=await db.auth.getSession();
  if(data.session){user=data.session.user;await enter();}
}
function showAuth(){$("auth").classList.remove("hidden");$("app").classList.add("hidden");}

async function enter(){
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  await ensureProfile();
  await loadProfile();
  renderStories();
  await loadFeed();
}

async function ensureProfile(){
  if(!user)return;
  const {data}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(!data){
    const base=(user.email||"usuario").split("@")[0].replace(/[^a-zA-Z0-9_]/g,"").slice(0,18)||"usuario";
    await db.from("profiles").insert({
      id:user.id,
      username:base+"_"+Math.floor(Math.random()*9999),
      display_name:base,
      bio:"",
      avatar_url:""
    });
  }
}

async function loadProfile(){
  const {data}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(!data)return;
  profile=data;
  const name=data.display_name||data.username||"Usuário";
  const av=data.avatar_url||avatar(name);

  $("profileAvatar").src=av;
  $("profileName").textContent=name;
  $("profileUsername").textContent=data.username?"@"+data.username:"";
  $("profileBio").textContent=data.bio||"";
  $("createAvatar").src=av;
  $("createName").textContent=name;
}

function renderStories(){
  const av=profile?.avatar_url||avatar(profile?.display_name||"Você");
  $("stories").innerHTML=`
    <div class="story">
      <div class="story-ring me story-plus">
        <div class="story-inner"><img src="${esc(av)}"></div>
      </div>
      <span>Seu story</span>
    </div>
    <div class="story">
      <div class="story-ring me">
        <div class="story-inner"><img src="${esc(av)}"></div>
      </div>
      <span>Seu perfil</span>
    </div>
  `;
}

async function loadFeed(){
  const {data,error}=await db.from("posts").select(`
    *,
    profiles:user_id(id,username,display_name,avatar_url)
  `).order("created_at",{ascending:false});

  if(error){
    $("feed").innerHTML=`<div style="padding:30px;text-align:center;color:var(--muted)">Não foi possível carregar o feed.</div>`;
    return;
  }

  if(!data?.length){
    $("feed").innerHTML=`
      <div style="padding:55px 20px;text-align:center;color:var(--muted);font-size:13px">
        <div style="font-size:35px;margin-bottom:8px">✦</div>
        Ainda não há publicações.<br>
        Crie a primeira!
      </div>`;
    return;
  }

  const parts=[];
  for(const p of data)parts.push(await postHTML(p));
  $("feed").innerHTML=parts.join("");
}

async function postHTML(p){
  const pr=p.profiles||{};
  const name=pr.display_name||pr.username||"Usuário";
  const av=pr.avatar_url||avatar(name);

  const {count:likes}=await db.from("likes").select("*",{count:"exact",head:true}).eq("post_id",p.id);
  const {count:comments}=await db.from("comments").select("*",{count:"exact",head:true}).eq("post_id",p.id);
  const {data:liked}=await db.from("likes").select("id").eq("post_id",p.id).eq("user_id",user.id).maybeSingle();
  const {data:reposted}=await db.from("reposts").select("id").eq("post_id",p.id).eq("user_id",user.id).maybeSingle();

  let media="";
  if(p.media_url){
    media=p.media_type==="video"
      ? `<video class="media" src="${esc(p.media_url)}" controls playsinline></video>`
      : `<img class="media" src="${esc(p.media_url)}" alt="">`;
  }

  return `
  <article class="post" id="post-${esc(p.id)}">
    <div class="post-head">
      <div class="post-user">
        <img class="post-avatar" src="${esc(av)}">
        <div class="post-user-text">
          <div class="post-name">${esc(name)}</div>
          <div class="post-meta">${pr.username?"@"+esc(pr.username):""} · ${date(p.created_at)}</div>
        </div>
      </div>
      <button class="more" onclick="share('${esc(p.id)}')">•••</button>
    </div>
    ${media}
    <div class="post-body">
      <div class="actions">
        <button class="action ${liked?"active":""}" onclick="like('${esc(p.id)}')">${liked?"♥":"♡"}</button>
        <button class="action" onclick="toggleComments('${esc(p.id)}')">♧</button>
        <button class="action repost ${reposted?"active":""}" onclick="repost('${esc(p.id)}')">↻</button>
        <button class="action share" onclick="share('${esc(p.id)}')">⌁</button>
      </div>
      <div class="likes">${likes||0} curtidas</div>
      ${p.caption?`<div class="caption"><strong>${esc(name)}</strong>${esc(p.caption)}</div>`:""}
      <button class="view-comments" onclick="toggleComments('${esc(p.id)}')">
        Ver ${comments||0} comentário(s)
      </button>
      <div id="comments-${esc(p.id)}" class="comments-list hidden"></div>
    </div>
  </article>`;
}

async function like(id){
  const {data}=await db.from("likes").select("id").eq("post_id",id).eq("user_id",user.id).maybeSingle();
  if(data)await db.from("likes").delete().eq("id",data.id);
  else await db.from("likes").insert({post_id:id,user_id:user.id});
  await loadFeed();
}

async function repost(id){
  const {data}=await db.from("reposts").select("id").eq("post_id",id).eq("user_id",user.id).maybeSingle();
  if(data){await db.from("reposts").delete().eq("id",data.id);toast("Repost removido");}
  else{await db.from("reposts").insert({post_id:id,user_id:user.id});toast("Repostado!");}
  await loadFeed();
}

async function toggleComments(id){
  const box=$("comments-"+id);
  box.classList.toggle("hidden");
  if(box.classList.contains("hidden"))return;

  const {data}=await db.from("comments").select(`
    *,profiles:user_id(username,display_name,avatar_url)
  `).eq("post_id",id).order("created_at",{ascending:true});

  box.innerHTML=(data||[]).map(c=>{
    const p=c.profiles||{};
    const n=p.display_name||p.username||"Usuário";
    return `<div class="comment">
      <img src="${esc(p.avatar_url||avatar(n))}">
      <div class="comment-content"><strong>${esc(n)}</strong>${esc(c.content)}</div>
    </div>`;
  }).join("")+
  `<div class="comment-box">
    <input id="ci-${esc(id)}" placeholder="Adicionar comentário..." onkeydown="if(event.key==='Enter')comment('${esc(id)}')">
    <button onclick="comment('${esc(id)}')">Enviar</button>
  </div>`;
}

async function comment(id){
  const input=$("ci-"+id);
  if(!input||!input.value.trim())return;
  const {error}=await db.from("comments").insert({post_id:id,user_id:user.id,content:input.value.trim()});
  if(error)return toast(error.message);
  await toggleComments(id);
  const box=$("comments-"+id);
  box.classList.remove("hidden");
  await toggleComments(id);
}

async function share(id){
  const url=location.origin+location.pathname+"?post="+encodeURIComponent(id);
  try{
    if(navigator.share)await navigator.share({title:"Vibra",text:"Veja esta publicação no Vibra",url});
    else{await navigator.clipboard.writeText(url);toast("Link copiado!");}
  }catch(e){}
}

function showPage(page){
  ["home","search","create","profile","messages"].forEach(x=>{
    const el=$(x+"Page");
    if(el)el.classList.toggle("hidden",x!==page);
  });

  ["navHome","navSearch","navCreate","navReels","navProfile"].forEach(x=>$(x)?.classList.remove("active"));
  const map={home:"navHome",search:"navSearch",create:"navCreate",profile:"navProfile",messages:"navReels"};
  $(map[page])?.classList.add("active");

  if(page==="profile")loadProfileGrid("posts");
}

function previewMedia(){
  const file=$("mediaFile").files[0];
  if(!file){$("preview").innerHTML="";return;}
  const u=URL.createObjectURL(file);
  $("preview").innerHTML=file.type.startsWith("video/")
    ? `<video src="${u}" controls></video>`
    : `<img src="${u}">`;
}

function dataURL(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

async function publish(){
  const caption=$("caption").value.trim();
  const file=$("mediaFile").files[0];
  if(!caption&&!file)return toast("Escreva algo ou escolha uma mídia.");
  if(file&&file.size>2*1024*1024)return toast("O arquivo precisa ter até 2 MB.");

  let media_url="",media_type="";
  if(file){
    media_url=await dataURL(file);
    media_type=file.type.startsWith("video/")?"video":"image";
  }

  const {error}=await db.from("posts").insert({
    user_id:user.id,caption,media_url,media_type
  });
  if(error)return toast(error.message);

  $("caption").value="";
  $("mediaFile").value="";
  $("preview").innerHTML="";
  toast("Publicado! ✨");
  showPage("home");
  await loadFeed();
}

async function loadProfileGrid(type){
  const grid=$("profileGrid");
  grid.innerHTML="";

  if(type==="reposts"){
    const {data:r}=await db.from("reposts").select("*").eq("user_id",user.id).order("created_at",{ascending:false});
    const ids=(r||[]).map(x=>x.post_id);
    if(!ids.length)return;
    const {data}=await db.from("posts").select("*").in("id",ids);
    renderGrid(data||[]);
    return;
  }

  if(type==="saved"){
    grid.innerHTML=`<div style="grid-column:1/-1;padding:45px;text-align:center;color:var(--muted);font-size:12px">Nenhuma publicação salva.</div>`;
    return;
  }

  if(type==="reels"){
    const {data}=await db.from("posts").select("*").eq("user_id",user.id).eq("media_type","video").order("created_at",{ascending:false});
    renderGrid(data||[]);
    return;
  }

  const {data}=await db.from("posts").select("*").eq("user_id",user.id).order("created_at",{ascending:false});
  renderGrid(data||[]);
}

function renderGrid(data){
  const grid=$("profileGrid");
  if(!data.length){
    grid.innerHTML=`<div style="grid-column:1/-1;padding:45px;text-align:center;color:var(--muted);font-size:12px">Nenhuma publicação.</div>`;
    return;
  }
  grid.innerHTML=data.map(p=>{
    if(p.media_url){
      return `<div class="grid-item">${p.media_type==="video"
        ? `<video src="${esc(p.media_url)}"></video>`
        : `<img src="${esc(p.media_url)}">`}</div>`;
    }
    return `<div class="grid-item"><div class="grid-text">${esc(p.caption||"")}</div></div>`;
  }).join("");
}

function profileTab(type){
  document.querySelectorAll(".profile-tab").forEach(x=>x.classList.remove("active"));
  const ids={posts:"tabPosts",reels:"tabReels",reposts:"tabReposts",saved:"tabSaved"};
  $(ids[type]).classList.add("active");
  loadProfileGrid(type);
}

async function searchEverything(){
  const q=$("searchInput").value.trim();
  const out=$("searchResults");
  if(!q){out.innerHTML="";return;}

  const safe=q.replace(/[%_,]/g," ");
  const {data:people}=await db.from("profiles").select("id,username,display_name,avatar_url")
    .or(`username.ilike.%${safe}%,display_name.ilike.%${safe}%`).limit(10);

  out.innerHTML="";
  if(people?.length){
    out.innerHTML+=`<div class="search-title">Pessoas</div>`;
    people.forEach(p=>{
      const n=p.display_name||p.username||"Usuário";
      out.innerHTML+=`<div class="search-person">
        <img src="${esc(p.avatar_url||avatar(n))}">
        <div><div class="search-person-name">${esc(n)}</div><div class="search-person-user">@${esc(p.username||"")}</div></div>
      </div>`;
    });
  }
  if(!people?.length)out.innerHTML=`<div style="padding:40px;text-align:center;color:var(--muted);font-size:12px">Nenhum resultado.</div>`;
}

function openEdit(){
  $("editName").value=profile?.display_name||"";
  $("editUsername").value=profile?.username||"";
  $("editBio").value=profile?.bio||"";
  $("editModal").classList.remove("hidden");
}
function closeEdit(){$("editModal").classList.add("hidden")}

async function saveProfile(){
  let av=profile?.avatar_url||"";
  const f=$("editAvatar").files[0];
  if(f){
    if(f.size>2*1024*1024)return toast("A imagem precisa ter até 2 MB.");
    av=await dataURL(f);
  }
  const {error}=await db.from("profiles").update({
    display_name:$("editName").value.trim(),
    username:$("editUsername").value.trim(),
    bio:$("editBio").value.trim(),
    avatar_url:av
  }).eq("id",user.id);
  if(error)return toast(error.message);
  closeEdit();
  await loadProfile();
  toast("Perfil atualizado!");
}

function loadTheme(){
  if(localStorage.getItem("vibra_theme")==="dark")document.body.classList.add("dark");
}
function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem("vibra_theme",document.body.classList.contains("dark")?"dark":"light");
}

document.addEventListener("dblclick",e=>{
  const post=e.target.closest(".post");
  if(post){
    const id=post.id.replace("post-","");
    like(id);
  }
});

loadTheme();
check();
</script>
</body>
</html>
